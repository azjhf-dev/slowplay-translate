<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>SlowPlay Translate</title>
<style>
  :root { --bg:#0b0f14; --card:#131a22; --accent:#4cc2ff; --text:#e8eef4; --muted:#8fa1b3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:6px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .row { display:flex; gap:8px; }
  input[type=url] { flex:1; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid #2a3644; background:var(--card); color:var(--text); font-size:15px; outline:none; }
  input[type=url]:focus { border-color:var(--accent); }
  button { padding:12px 18px; border-radius:12px; border:0; background:var(--accent); color:#04222f; font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .status { margin-top:16px; color:var(--muted); font-size:14px; }
  .status b { color:var(--text); }
  .err { margin-top:16px; color:#ff8f8f; font-size:14px; white-space:pre-wrap; }
  .meta { margin:16px 0 8px; font-size:14px; color:var(--muted); }
  .meta b { color:var(--text); }
  .player { margin-top:8px; border:1px solid #2a3644; border-radius:14px; overflow:hidden; background:#000; }
  .video-frame { background:#000; }
  video { display:block; width:100%; height:auto; max-height:60vh; max-height:60svh; object-fit:contain; background:#000; }
  /* Captions are a separate flow row, never a layer over the lesson. */
  .caps { position:static; min-height:140px; padding:12px 14px; text-align:center; background:var(--card); border-top:1px solid #2a3644; }
  .caps[hidden] { display:none; }
  .cap-src, .cap-en { margin:0; overflow-wrap:anywhere; }
  .cap-src { font-size:clamp(17px,4.6vw,24px); font-weight:700; line-height:1.5; unicode-bidi:plaintext; }
  .cap-en { font-size:clamp(13px,3.6vw,17px); color:#ffe9a8; line-height:1.45; margin-top:8px; }
  .cap-en:first-child { margin-top:0; }
  @media (max-width:600px) {
    video { max-height:52vh; max-height:52svh; }
    .caps { min-height:150px; }
  }
  .bar { display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px; flex-wrap:wrap; }
  .speeds { display:flex; gap:6px; }
  .speed { padding:8px 14px; border-radius:10px; background:var(--card); color:var(--text); border:1px solid #2a3644; font-size:14px; font-weight:600; }
  .speed.on { background:var(--accent); color:#04222f; border-color:var(--accent); }
  .tog { padding:8px 12px; border-radius:10px; background:var(--card); color:var(--muted); border:1px solid #2a3644; font-size:13px; }
  .tog.on { color:var(--text); border-color:var(--accent); }
  .hint { margin-top:22px; color:var(--muted); font-size:12.5px; line-height:1.6; }
  .queue { border:1px solid #2a3644; border-radius:12px; overflow:hidden; max-height:340px; overflow-y:auto; background:var(--card); }
  .qi { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid #1e2833; cursor:pointer; font-size:14px; }
  .qi.cur { background:#1b2a38; border-left:3px solid var(--accent); }
  .qn { color:var(--muted); width:22px; text-align:right; flex:none; }
  .qt { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:auto; }
  .qs { font-size:11px; color:var(--muted); flex:none; }
  .qs.ready { color:#7be08f; } .qs.error { color:#ff8f8f; }
  .qx { color:var(--muted); padding:0 4px; font-size:18px; }
  .errtxt { color:#ff8f8f; }
  button.speed:disabled { opacity:.35; }
  .mt{margin-top:20px} .mt2{margin-top:12px} .lnk{color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
