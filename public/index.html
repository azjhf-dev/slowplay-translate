<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>SlowPlay Translate</title>
<style>
  :root { --bg:#0b0f14; --card:#131a22; --accent:#4cc2ff; --text:#e8eef4; --muted:#8fa1b3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:6px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .row { display:flex; gap:8px; }
  input[type=url] { flex:1; padding:12px 14px; border-radius:12px; border:1px solid #2a3644; background:var(--card); color:var(--text); font-size:15px; outline:none; }
  input[type=url]:focus { border-color:var(--accent); }
  button { padding:12px 18px; border-radius:12px; border:0; background:var(--accent); color:#04222f; font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .status { margin-top:16px; color:var(--muted); font-size:14px; }
  .status b { color:var(--text); }
  .err { margin-top:16px; color:#ff8f8f; font-size:14px; white-space:pre-wrap; }
  .meta { margin:16px 0 8px; font-size:14px; color:var(--muted); }
  .meta b { color:var(--text); }
  .player { position:relative; margin-top:8px; border-radius:14px; overflow:hidden; background:#000; }
  video { display:block; width:100%; max-height:70vh; background:#000; }
  .caps { position:absolute; left:0; right:0; bottom:6%; text-align:center; pointer-events:none; padding:0 10px; }
  .cap-src, .cap-en {
    display:table; max-width:100%; margin-left:auto; margin-right:auto;
    padding:.16em .5em; border-radius:.45em; background:rgba(0,0,0,.84);
    box-decoration-break:clone; -webkit-box-decoration-break:clone;
    text-shadow:0 1px 2px rgba(0,0,0,.9); overflow-wrap:anywhere;
  }
  .cap-src { font-size:clamp(17px,4.6vw,24px); font-weight:700; line-height:1.5; direction:auto; }
  .cap-en { font-size:clamp(13px,3.6vw,17px); color:#ffe9a8; line-height:1.45; margin-top:5px; }
  .bar { display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px; flex-wrap:wrap; }
  .speeds { display:flex; gap:6px; }
  .speed { padding:8px 14px; border-radius:10px; background:var(--card); color:var(--text); border:1px solid #2a3644; font-size:14px; font-weight:600; }
  .speed.on { background:var(--accent); color:#04222f; border-color:var(--accent); }
  .tog { padding:8px 12px; border-radius:10px; background:var(--card); color:var(--muted); border:1px solid #2a3644; font-size:13px; }
  .tog.on { color:var(--text); border-color:var(--accent); }
  .hint { margin-top:22px; color:var(--muted); font-size:12.5px; line-height:1.6; }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
